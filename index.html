<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screener</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%2316231d%22/%3E%3Cpath d=%22M8 22l5-6 4 3 7-9%22 stroke=%22%2389c2a3%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f5f4; --panel: #fff; --ink: #18201c; --muted: #66706b; --faint: #9aa29e; --line: #e2e6e3; --line2: #eef1ef;
    --side: #16231d; --side-ink: #c9d6cf; --side-active: #24372e;
    --accent: #1f5a43; --accent-soft: #e5f0ea;
    --go: #1d7048; --go-bg: #e2f1e8; --mid: #8a5a12; --mid-bg: #fbf0dc; --no: #a63a32; --no-bg: #f8e4e1; --info: #3b5b86; --info-bg: #e6edf6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  .num, td.n, th.n { font-variant-numeric: tabular-nums; text-align: right; }
  .shell { display: grid; grid-template-columns: 208px 1fr; min-height: 100vh; }

  /* sidebar */
  aside { background: var(--side); color: var(--side-ink); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 2px; color: #fff; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .brand svg { flex: none; }
  .firm { padding: 0 8px 14px 34px; font-size: 11.5px; color: #8fa198; }
  aside a { color: var(--side-ink); text-decoration: none; padding: 7px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
  aside a:hover { background: #1d2d25; }
  aside a.on { background: var(--side-active); color: #fff; }
  aside a .ct { font-size: 11px; color: #8fa198; }
  .side-foot { margin-top: auto; font-size: 11px; color: #7d8f86; padding: 8px; line-height: 1.4; }

  /* main */
  main { min-width: 0; }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .top h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .top .crumb { color: var(--muted); }
  .top .sp { flex: 1; }
  .page { padding: 18px 24px 40px; max-width: 1240px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .panel-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .panel-b { padding: 14px; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 6px 12px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn2 { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 6px; padding: 6px 11px; font: inherit; cursor: pointer; }
  .btn2:hover { border-color: #c9cfcb; }
  .link { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 0; }
  input, select, textarea { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  textarea { width: 100%; resize: vertical; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  label.f input, label.f select { color: var(--ink); }

  /* kpis */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .kpi .k { font-size: 11.5px; color: var(--muted); }
  .kpi .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi .s { font-size: 11.5px; color: var(--faint); }

  /* tables */
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--line); background: #fafbfa; white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
  tr.row { cursor: pointer; } tr.row:hover td { background: #f8faf9; }
  td .co { font-weight: 600; } td .sub { font-size: 11.5px; color: var(--muted); }
  .tag { display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 3px; background: #eef1ef; color: var(--muted); vertical-align: 1px; margin-left: 4px; font-weight: 500; }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .go { background: var(--go-bg); color: var(--go); } .mid { background: var(--mid-bg); color: var(--mid); } .no { background: var(--no-bg); color: var(--no); } .inf { background: var(--info-bg); color: var(--info); }
  .stage { font-size: 12px; padding: 3px 6px; }
  .due-soon { color: var(--no); font-weight: 600; }
  .filters { display: flex; gap: 6px; margin: 0 0 10px; flex-wrap: wrap; }
  .fbtn { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 10px; cursor: pointer; font: inherit; font-size: 12px; color: var(--muted); }
  .fbtn.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* deal page */
  .deal-h { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
  .deal-h h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  .deal-h .meta { color: var(--muted); margin-top: 2px; }
  .deal-h .ctl { margin-left: auto; display: flex; gap: 8px; align-items: flex-end; }
  .stats { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; }
  .stats > div { padding: 9px 12px; border-right: 1px solid var(--line2); }
  .stats > div:last-child { border-right: 0; }
  .stats .k { font-size: 11px; color: var(--muted); }
  .stats .v { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabs a { padding: 8px 12px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  td input.cell { width: 90px; text-align: right; padding: 4px 6px; font-variant-numeric: tabular-nums; }
  td input.cell.yr { width: 80px; text-align: left; }
  input.ovr { border-color: var(--accent); background: var(--accent-soft); }
  .hint { font-size: 11.5px; color: var(--faint); }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { display: grid; grid-template-columns: 18px 190px 1fr; gap: 8px; padding: 4px 0; align-items: baseline; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .c-pass .dot { background: var(--go); } .c-fail .dot { background: var(--no); } .c-flag .dot { background: #c98a1a; } .c-unknown .dot { background: #b7bdb9; }
  .c-fail span:last-child { color: var(--no); }
  .sens td, .sens th { text-align: center; padding: 6px; font-variant-numeric: tabular-nums; }
  .sens th { background: none; text-transform: none; letter-spacing: 0; font-size: 11.5px; }
  .h4 { background: #cfe8da; } .h3 { background: #e4f1e9; } .h2 { background: #fbf0dc; } .h1 { background: #f8e4e1; }
  td.base { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 700; }
  .note { border-left: 2px solid var(--line); padding: 2px 0 2px 10px; margin-bottom: 10px; }
  .note .when { font-size: 11.5px; color: var(--faint); }
  .empty { text-align: center; color: var(--muted); padding: 28px; }

  /* memo document */
  .doc { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 32px 40px; max-width: 860px; font-size: 13.5px; }
  .doc .eyebrow { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .doc h2 { font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 600; margin: 4px 0 2px; }
  .doc .dmeta { color: var(--muted); font-size: 12px; }
  .doc .dtop { border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 14px; }
  .doc h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin: 18px 0 8px; }
  .doc p { margin: 5px 0; }
  .doc ol, .doc ul { margin: 4px 0; padding-left: 20px; }
  .doc table td, .doc table th { padding: 5px 8px; }
  .rec { display: flex; justify-content: space-between; gap: 16px; border-radius: 6px; padding: 12px 14px; }
  .rec .l { font-weight: 700; font-size: 14.5px; }
  .rec .r { text-align: right; min-width: 160px; }
  .rec .r .v { font-size: 19px; font-weight: 700; }
  .rec .r .k { font-size: 11.5px; opacity: .85; }
  .fin .proj { color: var(--muted); font-style: italic; background: #fafbfa; }
  .fin tr.sub td { color: var(--muted); font-size: 12px; }
  .ret { display: grid; grid-template-columns: 1fr 1.15fr; gap: 18px; align-items: start; }
  .kv td:last-child { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kv tr.tot td { border-top: 2px solid var(--ink); font-weight: 700; }

  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 6px; opacity: 0; pointer-events: none; transition: all .18s; z-index: 50; }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  .busy { opacity: .5; pointer-events: none; }

  @media (max-width: 960px) {
    .shell { grid-template-columns: 1fr; } aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; } .firm, .side-foot { display: none; }
    .kpis, .grid4 { grid-template-columns: 1fr 1fr; } .stats { grid-template-columns: repeat(3, 1fr); } .grid2, .grid3, .ret { grid-template-columns: 1fr; }
    .deal-h { flex-direction: column; } .deal-h .ctl { margin-left: 0; flex-wrap: wrap; } .page { padding: 14px; } .doc { padding: 20px; }
    .checks li { grid-template-columns: 18px 1fr; } .checks li span:last-child { grid-column: 2; }
  }
  @media print {
    @page { margin: .6in; }
    body { background: #fff; }
    aside, .top, .deal-h, .stats, .tabs, #toast, .no-print { display: none !important; }
    .shell { display: block; } .page { padding: 0; max-width: none; }
    .doc { border: 0; padding: 0; max-width: none; font-size: 10.5pt; }
    .rec { flex-direction: row !important; } .ret { grid-template-columns: 1fr 1.15fr !important; }
    .checks li { grid-template-columns: 18px 190px 1fr !important; } .checks li span:last-child { grid-column: auto !important; }
    table, .rec, .ret { break-inside: avoid; } .doc h3 { break-after: avoid; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><svg width="20" height="20" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#24372e"/><path d="M8 22l5-6 4 3 7-9" stroke="#89c2a3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Screener</div>
    <div class="firm" id="firmName"></div>
    <a href="#/pipeline" data-nav="pipeline">Pipeline <span class="ct" id="navCt"></span></a>
    <a href="#/new" data-nav="new">New deal</a>
    <a href="#/criteria" data-nav="criteria">Fund criteria</a>
    <a href="#/settings" data-nav="settings">Settings</a>
    <div class="side-foot">Sample deals are fictional.<br>Data is stored in this browser.</div>
  </aside>
  <main>
    <div class="top"><h1 id="title"></h1><span class="sp"></span><span id="topActions"></span></div>
    <div class="page" id="view"></div>
  </main>
</div>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
